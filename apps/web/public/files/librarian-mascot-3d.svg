  <ellipse cx="206" cy="215" rx="17" ry="22" fill="url(#gEye)"/>
  <ellipse cx="306" cy="215" rx="17" ry="22" fill="url(#gEye)"/>
  <circle cx="212" cy="206" r="7" fill="#fff"/><circle cx="312" cy="206" r="7" fill="#fff"/>
  <circle cx="200" cy="224" r="3.5" fill="#fff" opacity=".85"/><circle cx="300" cy="224" r="3.5" fill="#fff" opacity=".85"/>

