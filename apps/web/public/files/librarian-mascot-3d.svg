  <path d="M241 250 Q256 243 271 250 Q256 270 241 250Z" fill="url(#gNose)"/>
  <ellipse cx="251" cy="250" rx="6" ry="2.5" fill="#fff" opacity=".5"/>
  <g fill="none" stroke="#6B3E26" stroke-width="4.5" stroke-linecap="round">
    <path d="M256 262 V275"/><path d="M256 275 Q238 293 222 277"/><path d="M256 275 Q274 293 290 277"/>
  </g>
