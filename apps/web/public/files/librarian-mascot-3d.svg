    <rect x="102" y="446" width="48" height="66" rx="3" fill="url(#gPage)"/>
    <rect x="154" y="446" width="44" height="66" rx="3" fill="url(#gPage)"/>
    <rect x="149" y="446" width="6" height="66" fill="#000" opacity=".15" filter="url(#blur3)"/>
    <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
      <line x1="110" y1="460" x2="142" y2="460"/><line x1="110" y1="472" x2="142" y2="472"/><line x1="110" y1="484" x2="136" y2="484"/>
      <line x1="162" y1="460" x2="190" y2="460"/><line x1="162" y1="472" x2="190" y2="472"/><line x1="162" y1="484" x2="184" y2="484"/>
    </g>
    <rect x="97" y="442" width="50" height="5" rx="2.5" fill="#fff" opacity=".3"/>
  </g>
  <g filter="url(#drop)">
