<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="gMane" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#FFCB74"/><stop offset=".55" stop-color="#F4A340"/><stop offset="1" stop-color="#B8600E"/></radialGradient>
    <radialGradient id="gSkin" cx=".38" cy=".3" r=".9"><stop offset="0" stop-color="#FFFEF8"/><stop offset=".55" stop-color="#FFEFD0"/><stop offset="1" stop-color="#E3BD84"/></radialGradient>
    <radialGradient id="gMuzzle" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0DDBD"/></radialGradient>
    <radialGradient id="gNavy" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#5B84D1"/><stop offset=".45" stop-color="#25458A"/><stop offset="1" stop-color="#0E1D3F"/></radialGradient>
    <linearGradient id="gArm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F78C8"/><stop offset="1" stop-color="#16295A"/></linearGradient>
    <radialGradient id="gEye" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#6B4630"/><stop offset=".6" stop-color="#2B1B12"/><stop offset="1" stop-color="#0E0805"/></radialGradient>
    <radialGradient id="gShoe" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#A86B44"/><stop offset="1" stop-color="#4A2714"/></radialGradient>
    <linearGradient id="gPants" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5A6577"/><stop offset="1" stop-color="#232B38"/></linearGradient>
    <linearGradient id="gBook" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DC4B2"/><stop offset="1" stop-color="#075049"/></linearGradient>
    <linearGradient id="gPage" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3DCCB"/></linearGradient>
    <radialGradient id="gNose" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#9A6240"/><stop offset="1" stop-color="#3F200F"/></radialGradient>
    <radialGradient id="gTie" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#FF6A7C"/><stop offset="1" stop-color="#9C1426"/></radialGradient>
    <radialGradient id="gShadeHead" cx=".45" cy=".3" r=".75"><stop offset=".6" stop-color="#8A4F10" stop-opacity="0"/><stop offset="1" stop-color="#8A4F10" stop-opacity=".38"/></radialGradient>
    <linearGradient id="gShadeBody" x1="0" y1="0" x2="1" y2="1"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur12" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="5" dy="9" stdDeviation="7" flood-color="#0b1020" flood-opacity=".32"/></filter>
    <clipPath id="cBody"><rect x="170" y="325" width="172" height="215" rx="55"/></clipPath>
    <clipPath id="cHead"><ellipse cx="256" cy="225" rx="115" ry="105"/></clipPath>
