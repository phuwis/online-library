    <ellipse cx="205" cy="380" rx="16" ry="48" fill="#fff" opacity=".18" filter="url(#blur6)"/>
  </g>
  <!-- badge -->
  <rect x="285" y="415" width="42" height="26" rx="4" fill="url(#gPage)" filter="url(#drop)"/>
  <rect x="291" y="423" width="30" height="4" rx="2" fill="#9CA3AF"/>
  <rect x="291" y="431" width="20" height="4" rx="2" fill="#9CA3AF"/>

  <!-- neck shadow from head -->
