      <circle cx="150" cy="170" r="45"/><circle cx="125" cy="235" r="45"/><circle cx="150" cy="300" r="42"/>
      <circle cx="362" cy="170" r="45"/><circle cx="387" cy="235" r="45"/><circle cx="362" cy="300" r="42"/>
