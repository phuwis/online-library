    <path d="M340 500 C420 500 450 450 430 410" fill="none" stroke="url(#gMane)" stroke-width="18" stroke-linecap="round"/>
    <circle cx="430" cy="404" r="22" fill="url(#gMane)"/>
    <ellipse cx="423" cy="396" rx="9" ry="6" fill="#fff" opacity=".35" filter="url(#blur3)"/>
  </g>

